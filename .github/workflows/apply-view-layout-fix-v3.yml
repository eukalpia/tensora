name: Tensor View Layout Repair V3

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: write

concurrency:
  group: tensor-view-layout-repair-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'ci: run tensor view repair v3' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/training-engine-v1
          fetch-depth: 0

      - name: Extract and apply guarded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/apply-view-layout-fix-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "cat > /tmp/tensor-view-layout.patch" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PATCH')
          patch_lines = []
          for line in lines[start:end]:
              if not line.startswith('          '):
                  raise SystemExit('embedded patch line lost YAML indentation')
              patch_lines.append(line[10:])
          Path('/tmp/tensor-view-layout.patch').write_text('\n'.join(patch_lines) + '\n')
          PY
          git apply --check /tmp/tensor-view-layout.patch
          git apply /tmp/tensor-view-layout.patch
          git diff --check

      - name: Validate Release matrix
        shell: bash
        run: |
          cmake -S native -B build/release -DCMAKE_BUILD_TYPE=Release -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=ON
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure

      - name: Validate Debug matrix
        shell: bash
        run: |
          cmake -S native -B build/debug -DCMAKE_BUILD_TYPE=Debug -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/debug --parallel 2
          ctest --test-dir build/debug --output-on-failure

      - name: Validate ASan and UBSan matrix
        shell: bash
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S native -B build/asan -DCMAKE_BUILD_TYPE=Debug -DTENSORA_ENABLE_SANITIZERS=ON -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan --output-on-failure

      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/CMakeLists.txt native/src/c_api.cc native/src/autograd/autograd.h native/src/backends/cpu/cpu_backend.cc
          git diff --cached --check
          git commit -m 'fix: canonicalize materialized tensor layouts'
          git push origin HEAD:feature/training-engine-v1
