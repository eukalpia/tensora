name: Native Dependency Snapshot

on:
  push:
    branches:
      - work/source-snapshot-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Package pinned native dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORT_VERSION: '1.26.0'
      ORT_SHA256: '1254da24fb389cf39dc0ff3451ab48301740ffbfcbaf646849df92f80ee92c57'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned LibTorch package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            torch==2.13.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Download and verify pinned ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          curl --fail --location --retry 3 \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            --output "$archive"
          echo "${ORT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/dependencies"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/dependencies"
          torch_root="$(python -c 'import pathlib, torch; print(pathlib.Path(torch.__file__).parent)')"
          cp -a "$torch_root" "${RUNNER_TEMP}/dependencies/torch"

      - name: Create dependency archive
        shell: bash
        run: >-
          tar -C "${RUNNER_TEMP}/dependencies"
          -czf "${RUNNER_TEMP}/tensora-native-dependencies.tar.gz" .

      - name: Upload dependency archive
        uses: actions/upload-artifact@v4
        with:
          name: tensora-native-dependencies
          path: ${{ runner.temp }}/tensora-native-dependencies.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
