name: Apply P1A exact patch

on:
  push:
    branches:
      - feature/p1-tensor-core-v2
    paths:
      - .github/workflows/apply-p1a-exact.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'eukalpia'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: feature/p1-tensor-core-v2
          fetch-depth: 0

      - name: Apply exact P1A patch and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/tensora-p1a.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/tensora-p1a.patch.gz.b64 | gzip -d > /tmp/tensora-p1a.patch
          git apply --check /tmp/tensora-p1a.patch
          git apply /tmp/tensora-p1a.patch
          git rm .github/workflows/apply-p1a-exact.yml
          git config user.name eukalpia
          git config user.email 120781817+eukalpia@users.noreply.github.com
          git add -A
          git commit -m 'feat: complete P1A typed tensor execution'
          git push origin HEAD:feature/p1-tensor-core-v2
