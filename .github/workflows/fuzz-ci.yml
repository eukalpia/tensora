name: C ABI Fuzz CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'perf/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-c-abi-fuzz:
    name: Public C ABI libFuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure sanitized core runtime
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S native -B build/fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DTENSORA_ENABLE_SANITIZERS=ON
          -DTENSORA_BUILD_TESTS=OFF
          -DTENSORA_BUILD_BENCHMARKS=OFF

      - name: Build sanitized core runtime
        run: cmake --build build/fuzz --parallel 2

      - name: Build public ABI fuzz target
        shell: bash
        run: |
          set -euo pipefail
          clang++ \
            -std=c++20 \
            -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=fuzzer,address,undefined \
            -fno-omit-frame-pointer \
            -I native/include \
            native/tests/fuzz_c_abi.cc \
            -L build/fuzz -ltensora_native \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/build/fuzz" \
            -o build/fuzz/tensora_c_abi_fuzzer

      - name: Run deterministic fuzz budget
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ./build/fuzz/tensora_c_abi_fuzzer
          -runs=50000
          -max_len=256
          -timeout=5
