name: Autograd Contract Expansion V2

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'ci: validate autograd contract expansion v2' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/training-engine-v1
          fetch-depth: 0

      - name: Expand internal autograd contracts
        shell: bash
        env:
          CLASS_B64: 
          FUNCTION_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('native/tests/training_core_internal_test.cc')
          text = path.read_text()
          include_anchor = '#include "core/status.h"\n'
          if text.count(include_anchor) != 1:
              raise SystemExit('include anchor mismatch')
          text = text.replace(include_anchor,
                              include_anchor + '#include "memory/tensor_storage.h"\n', 1)
          class_anchor = '  return tensor;\n}\n\nvoid TestDirectArgumentContracts() {'
          class_block = base64.b64decode(os.environ['CLASS_B64']).decode()
          if text.count(class_anchor) != 1:
              raise SystemExit('class anchor mismatch')
          text = text.replace(class_anchor, class_block, 1)
          function_anchor = 'void WriteBytes(const std::filesystem::path& path,\n'
          function = base64.b64decode(os.environ['FUNCTION_B64']).decode()
          if text.count(function_anchor) != 1:
              raise SystemExit('function insertion anchor mismatch')
          text = text.replace(function_anchor, function + function_anchor, 1)
          main_anchor = '  TestAutogradInternalContracts();\n  TestCheckpointCorruptionContracts();'
          main_replacement = '  TestAutogradInternalContracts();\n  TestAutogradReachableEdgeContracts();\n  TestCheckpointCorruptionContracts();'
          if text.count(main_anchor) != 1:
              raise SystemExit('main anchor mismatch')
          path.write_text(text.replace(main_anchor, main_replacement, 1))
          PY
          git diff --check

      - name: Validate Release matrix
        run: |
          cmake -S native -B build/release -DCMAKE_BUILD_TYPE=Release -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure

      - name: Validate ASan and UBSan matrix
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S native -B build/asan -DCMAKE_BUILD_TYPE=Debug -DTENSORA_ENABLE_SANITIZERS=ON -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan --output-on-failure

      - name: Commit validated contracts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/tests/training_core_internal_test.cc
          git diff --cached --check
          git commit -m 'test: expand autograd edge contracts'
          git push origin HEAD:feature/training-engine-v1
