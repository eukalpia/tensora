name: Torch Backend Contract Expansion

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'ci: validate torch backend contract expansion' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/training-engine-v1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU PyTorch
        run: python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Apply expanded internal Torch contracts
        shell: bash
        env:
          TEST_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path('native/tests/training_backend_internal_test.cc').write_text(
              base64.b64decode(os.environ['TEST_B64']).decode())
          PY
          git diff --check
      - name: Configure pinned LibTorch test build
        shell: bash
        run: |
          TORCH_PREFIX="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          echo "TORCH_LIB=$(python -c 'import pathlib,torch; print(pathlib.Path(torch.__file__).parent / "lib")')" >> "$GITHUB_ENV"
          cmake -S native -B build/torch -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$TORCH_PREFIX" -DTENSORA_WITH_TORCH=ON -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
      - name: Build focused internal backend target
        run: cmake --build build/torch --target tensora_training_backend_internal_tests --parallel 2
      - name: Run focused internal backend target
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$TORCH_LIB:${GITHUB_WORKSPACE}/build/torch:${LD_LIBRARY_PATH:-}"
          ./build/torch/tensora_training_backend_internal_tests
      - name: Commit validated contracts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/tests/training_backend_internal_test.cc
          git diff --cached --check
          git commit -m 'test: expand LibTorch backend edge contracts'
          git push origin HEAD:feature/training-engine-v1
