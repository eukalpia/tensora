name: CPU Training Engine CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'perf/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-training-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-only-training:
    name: Core-only training / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Tensora without LibTorch
        run: >-
          cmake -S native -B build/cpu-training
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTENSORA_WITH_TORCH=OFF
          -DTENSORA_WITH_ONNXRUNTIME=OFF
          -DTENSORA_BUILD_TESTS=ON
          -DTENSORA_BUILD_BENCHMARKS=OFF

      - name: Build Tensora core
        run: cmake --build build/cpu-training --parallel

      - name: Compile CPU training proof
        run: >-
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror
          native/tests/cpu_training_engine_test.cc
          -Inative/include
          -Lbuild/cpu-training
          -Wl,-rpath,$PWD/build/cpu-training
          -ltensora_native
          -o build/cpu_training_engine_test

      - name: Run CPU training proof
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/cpu-training
        run: ./build/cpu_training_engine_test

  core-only-training-sanitizers:
    name: Core-only training / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure sanitized Tensora core
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S native -B build/cpu-training-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DTENSORA_WITH_TORCH=OFF
          -DTENSORA_WITH_ONNXRUNTIME=OFF
          -DTENSORA_ENABLE_SANITIZERS=ON
          -DTENSORA_BUILD_TESTS=ON
          -DTENSORA_BUILD_BENCHMARKS=OFF

      - name: Build sanitized Tensora core
        run: cmake --build build/cpu-training-sanitized --parallel

      - name: Compile sanitized CPU training proof
        env:
          CC: clang
          CXX: clang++
        run: >-
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer
          native/tests/cpu_training_engine_test.cc
          -Inative/include
          -Lbuild/cpu-training-sanitized
          -Wl,-rpath,$PWD/build/cpu-training-sanitized
          -ltensora_native
          -fsanitize=address,undefined
          -o build/cpu_training_engine_test_sanitized

      - name: Run sanitized CPU training proof
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/cpu-training-sanitized
        run: ./build/cpu_training_engine_test_sanitized
