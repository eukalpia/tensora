name: CUDA Hardware Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-hardware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cuda-training:
    name: Real NVIDIA CUDA training
    runs-on: [self-hosted, linux, x64, gpu, nvidia]
    timeout-minutes: 90
    env:
      TENSORA_NATIVE_LIBRARY: ${{ github.workspace }}/build/cuda/libtensora_native.so

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify NVIDIA hardware and driver
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install pinned CUDA PyTorch
        run: >-
          python -m pip install
          torch==2.13.0+cu130
          --index-url https://download.pytorch.org/whl/cu130

      - name: Require CUDA-visible PyTorch and resolve native paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          if not torch.cuda.is_available():
              raise SystemExit('PyTorch cannot see a CUDA device; CPU fallback is forbidden')
          if torch.cuda.device_count() < 1:
              raise SystemExit('No CUDA devices reported')
          print('torch_version=' + torch.__version__)
          print('cuda_version=' + str(torch.version.cuda))
          print('device_count=' + str(torch.cuda.device_count()))
          print('device_0=' + torch.cuda.get_device_name(0))
          PY
          echo "TORCH_CMAKE_PREFIX=$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" >> "$GITHUB_ENV"
          echo "TORCH_LIBRARY_PATH=$(python -c 'import pathlib, torch; print(pathlib.Path(torch.__file__).parent / "lib")')" >> "$GITHUB_ENV"

      - name: Configure CUDA-capable training runtime
        shell: bash
        run: >-
          cmake -S native -B build/cuda
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$TORCH_CMAKE_PREFIX"
          -DTENSORA_WITH_TORCH=ON
          -DTENSORA_BUILD_TESTS=ON
          -DTENSORA_BUILD_BENCHMARKS=OFF

      - name: Build CUDA-capable runtime
        run: cmake --build build/cuda --config Release --parallel 2

      - name: Run native training acceptance on CUDA-capable build
        env:
          LD_LIBRARY_PATH: ${{ env.TORCH_LIBRARY_PATH }}
        run: ctest --test-dir build/cuda --build-config Release --output-on-failure

      - name: Resolve Dart dependencies
        working-directory: packages/tensora
        run: dart pub get

      - name: Verify CUDA test formatting
        working-directory: packages/tensora
        run: dart format --output=none --set-exit-if-changed integration_test/cuda_training_integration_test.dart

      - name: Analyze CUDA integration test
        working-directory: packages/tensora
        run: dart analyze --fatal-infos --fatal-warnings integration_test/cuda_training_integration_test.dart

      - name: Run real CUDA training acceptance
        working-directory: packages/tensora
        env:
          LD_LIBRARY_PATH: ${{ env.TORCH_LIBRARY_PATH }}
        run: dart test integration_test/cuda_training_integration_test.dart --reporter expanded
