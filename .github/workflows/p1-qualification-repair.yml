name: P1 Qualification Repair

on:
  workflow_dispatch:
  push:
    branches:
      - feature/p1-tensor-core-v2

permissions:
  contents: write

concurrency:
  group: p1-qualification-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout P1 branch
        uses: actions/checkout@v6
        with:
          ref: feature/p1-tensor-core-v2
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Apply qualification fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          tensor = Path('native/src/tensor/tensor.cc')
          text = tensor.read_text()
          for name in (
              'ts_tensor_from_host',
              'ts_tensor_full',
              'ts_tensor_cast',
              'ts_tensor_copy_to_host',
          ):
              pattern = re.compile(
                  rf'(?m)^(?!TS_API\s)(ts_status_t\s+{name}\s*\()'
              )
              text, count = pattern.subn(r'TS_API \1', text)
              if count not in (0, 1):
                  raise RuntimeError(
                      f'unexpected replacement count for {name}: {count}'
                  )
          tensor.write_text(text)

          abi_contract = Path('native/tests/dtype_abi_contract_test.c')
          text = abi_contract.read_text()
          text = text.replace(
              'ts_abi_version_is_5', 'ts_abi_version_is_6'
          )
          text = text.replace(
              'TS_ABI_VERSION == 5u', 'TS_ABI_VERSION == 6u'
          )
          abi_contract.write_text(text)

          internal_test = Path('native/tests/training_core_internal_test.cc')
          lines = internal_test.read_text().splitlines(keepends=True)
          header = Path('native/include/tensora.h').read_text()
          status_by_value = {
              int(value): name
              for name, value in re.findall(
                  r'\b(TS_STATUS_[A-Z0-9_]+)\s*=\s*(\d+)\b', header
              )
          }
          targets = {131: 6, 529: 2, 533: 2, 558: 4}
          missing = set(targets.values()) - set(status_by_value)
          if missing:
              raise RuntimeError(
                  f'could not resolve public status values: {sorted(missing)}'
              )
          for line_number, status_value in targets.items():
              index = line_number - 1
              candidates = [index]
              for delta in (1, -1, 2, -2, 3, -3):
                  candidate = index + delta
                  if 0 <= candidate < len(lines):
                      candidates.append(candidate)
              for candidate in candidates:
                  if re.search(r'\bTS_STATUS_[A-Z0-9_]+\b', lines[candidate]):
                      lines[candidate] = re.sub(
                          r'\bTS_STATUS_[A-Z0-9_]+\b',
                          status_by_value[status_value],
                          lines[candidate],
                          count=1,
                      )
                      break
              else:
                  raise RuntimeError(
                      f'no public status assertion near line {line_number}'
                  )
          internal_test.write_text(''.join(lines))

          runtime = Path(
              'packages/tensora/lib/src/native/native_runtime.dart'
          )
          lines = runtime.read_text().splitlines(keepends=True)
          for line_number, cast in (
              (434, 'T'),
              (441, 'TypedData'),
              (578, 'T'),
          ):
              index = line_number - 1
              line = lines[index]
              if f' as {cast};' in line:
                  continue
              if 'return ' not in line or ';' not in line:
                  raise RuntimeError(
                      f'unexpected Dart source at line {line_number}: {line!r}'
                  )
              before, _, after = line.rpartition(';')
              lines[index] = before + f' as {cast};' + after
          runtime.write_text(''.join(lines))
          PY

          dart format \
            packages/tensora/lib \
            packages/tensora/test \
            packages/tensora/benchmark

      - name: Build and test native core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B build/p1-repair \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTENSORA_BUILD_TESTS=ON \
            -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/p1-repair --parallel 2
          ctest --test-dir build/p1-repair --output-on-failure

      - name: Verify public ABI v6 contract
        shell: bash
        run: |
          set -euo pipefail
          cc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -Inative/include \
            native/tests/dtype_abi_contract_test.c \
            -o build/dtype-abi-contract
          ./build/dtype-abi-contract

      - name: Verify Dart package
        shell: bash
        env:
          TENSORA_NATIVE_LIBRARY: ${{ github.workspace }}/build/p1-repair/libtensora_native.so
        run: |
          set -euo pipefail
          dart pub get
          (
            cd packages/tensora
            dart analyze --fatal-infos --fatal-warnings
            dart test --reporter expanded
          )
          git diff --check

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair changes remain.'
            exit 0
          fi
          git config user.name 'Tensora Qualification Bot'
          git config user.email '120781817+eukalpia@users.noreply.github.com'
          git add \
            native/src/tensor/tensor.cc \
            native/tests/dtype_abi_contract_test.c \
            native/tests/training_core_internal_test.cc \
            packages/tensora/lib/src/dtype/half_codec.dart \
            packages/tensora/lib/src/native/native_bindings.dart \
            packages/tensora/lib/src/native/native_runtime.dart
          git commit -m 'fix(p1): close cross-platform dtype qualification blockers'
          git push origin HEAD:feature/p1-tensor-core-v2
