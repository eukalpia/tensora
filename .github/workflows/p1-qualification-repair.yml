name: P1 Qualification Repair

on:
  push:
    branches:
      - feature/p1-tensor-core-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-qualification-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/p1-tensor-core-v2
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Repair qualified contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def write_if_changed(path: Path, value: str) -> None:
              current = path.read_text()
              if current != value:
                  path.write_text(value)

          # P1A intentionally advances the public ABI to v6. Keep the standalone
          # C contract synchronized with the public header.
          abi_test = root / 'native/tests/dtype_abi_contract_test.c'
          source = abi_test.read_text()
          source = source.replace('ts_abi_version_is_5', 'ts_abi_version_is_6')
          source = re.sub(r'TS_ABI_VERSION\s*==\s*5u', 'TS_ABI_VERSION == 6u', source)
          write_if_changed(abi_test, source)

          # Public definitions inherit TS_API on Unix, but MSVC diagnoses a
          # dllimport declaration followed by an unannotated definition when
          # tensor.cc is compiled directly by white-box test executables.
          tensor_cc = root / 'native/src/tensor/tensor.cc'
          source = tensor_cc.read_text()
          for name in (
              'ts_tensor_from_host',
              'ts_tensor_full',
              'ts_tensor_cast',
              'ts_tensor_copy_to_host',
          ):
              pattern = re.compile(
                  rf'(?m)^(?!TS_API\s)(ts_status(?:_code)?\s+{name}\s*\()'
              )
              source, count = pattern.subn(r'TS_API \1', source, count=1)
              if count == 0 and not re.search(rf'(?m)^TS_API\s+ts_status(?:_code)?\s+{name}\s*\(', source):
                  raise SystemExit(f'Unable to locate exported definition for {name}')
          write_if_changed(tensor_cc, source)

          # The two white-box executables compile implementation translation
          # units directly. They therefore represent native-build code, not a
          # consumer importing functions from tensora_native.dll.
          cmake = root / 'native/CMakeLists.txt'
          source = cmake.read_text()
          marker = '# P1 Windows white-box linkage contract'
          if marker not in source:
              block = '''

          # P1 Windows white-box linkage contract
          if(WIN32)
            target_compile_definitions(tensora_handle_registry_tests PRIVATE TENSORA_NATIVE_BUILD)
            target_compile_definitions(tensora_training_core_internal_tests PRIVATE TENSORA_NATIVE_BUILD)
          endif()
          '''
              source += block
          write_if_changed(cmake, source)

          # Preserve the established P0/NN V2 error categories. P1A changed
          # storage representation, not the public meaning of these failures.
          public_header = (root / 'native/include/tensora.h').read_text()
          symbol_codes = {
              symbol: int(number)
              for symbol, number in re.findall(
                  r'(TS_STATUS_[A-Z0-9_]+)\s*=\s*(\d+)', public_header
              )
          }

          status_sources = ''
          for candidate in (
              root / 'native/src/core/status.h',
              root / 'native/src/core/status.cc',
          ):
              if candidate.exists():
                  status_sources += '\n' + candidate.read_text()

          factory_by_code: dict[int, str] = {}
          # Match both inline and out-of-line factory implementations.
          for factory, symbol in re.findall(
              r'Status::([A-Za-z0-9_]+)\s*\([^)]*\)[\s\S]{0,240}?'
              r'(TS_STATUS_[A-Z0-9_]+)',
              status_sources,
          ):
              if symbol in symbol_codes:
                  factory_by_code.setdefault(symbol_codes[symbol], factory)

          # Fall back only to names proven to exist in the source tree.
          conventional = {
              3: ('AllocationFailed', 'ResourceExhausted', 'OutOfMemory'),
              4: ('Unsupported', 'FailedPrecondition'),
              6: ('Internal',),
          }
          for code, names in conventional.items():
              if code not in factory_by_code:
                  for name in names:
                      if re.search(rf'\bStatus::{name}\s*\(', status_sources):
                          factory_by_code[code] = name
                          break

          def replace_nearest_factory(message: str, expected_code: int) -> None:
              if expected_code not in factory_by_code:
                  raise SystemExit(
                      f'No Status factory discovered for expected code {expected_code}'
                  )
              expected = factory_by_code[expected_code]
              for path in (root / 'native/src').rglob('*.cc'):
                  text = path.read_text()
                  position = text.find(message)
                  if position < 0:
                      continue
                  window_start = max(0, position - 500)
                  window = text[window_start:position]
                  matches = list(re.finditer(r'Status::([A-Za-z0-9_]+)\s*\(', window))
                  if not matches:
                      raise SystemExit(f'No Status factory found before {message!r} in {path}')
                  match = matches[-1]
                  absolute_start = window_start + match.start(1)
                  absolute_end = window_start + match.end(1)
                  if text[absolute_start:absolute_end] != expected:
                      text = text[:absolute_start] + expected + text[absolute_end:]
                      path.write_text(text)
                  return
              raise SystemExit(f'Unable to locate status message {message!r}')

          replace_nearest_factory('CPU tensor storage metadata is inconsistent', 4)
          replace_nearest_factory('cpu storage full: byte size overflows size_t', 3)
          replace_nearest_factory('cpu storage: byte size overflows size_t', 3)
          replace_nearest_factory('tensor is not backed by CPU storage', 6)

          # Dart 3.7 does not perform the newer generic return promotions used
          # by the current stable analyzer. Add explicit casts at the three
          # already diagnosed return sites, after their runtime validation.
          runtime = root / 'packages/tensora/lib/src/native/native_runtime.dart'
          lines = runtime.read_text().splitlines(keepends=True)

          def cast_return_near(approx_line: int, cast_type: str) -> None:
              low = max(0, approx_line - 12)
              high = min(len(lines), approx_line + 12)
              start = None
              for index in range(low, high):
                  if re.search(r'\breturn\b', lines[index]):
                      start = index
                      if index + 1 >= approx_line - 1:
                          break
              if start is None:
                  raise SystemExit(f'No return statement near line {approx_line}')
              end = start
              while end < len(lines) and ';' not in lines[end]:
                  end += 1
              if end >= len(lines):
                  raise SystemExit(f'Unterminated return statement near line {approx_line}')
              statement = ''.join(lines[start:end + 1])
              if re.search(rf'\bas\s+{re.escape(cast_type)}\s*;', statement):
                  return
              semicolon = statement.rfind(';')
              expression = statement[:semicolon].rstrip()
              # Preserve comments and multiline formatting by casting the whole
              # return expression instead of changing callback generic types.
              statement = expression + f' as {cast_type};' + statement[semicolon + 1:]
              lines[start:end + 1] = [statement]

          cast_return_near(434, 'T')
          cast_return_near(441, 'TypedData')
          cast_return_near(578, 'T')
          runtime.write_text(''.join(lines))
          PY

      - name: Resolve Dart workspace and format exact files
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart format \
            packages/tensora/lib/src/dtype/half_codec.dart \
            packages/tensora/lib/src/native/native_bindings.dart \
            packages/tensora/lib/src/native/native_runtime.dart

      - name: Verify native core repair
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B build/p1-repair \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTENSORA_BUILD_TESTS=ON \
            -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/p1-repair --parallel 2
          ctest --test-dir build/p1-repair --output-on-failure

      - name: Verify public ABI v6 contract
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Inative/include \
            native/tests/dtype_abi_contract_test.c \
            -o build/p1-repair/dtype_abi_contract
          build/p1-repair/dtype_abi_contract

      - name: Verify Dart production surface
        shell: bash
        run: |
          set -euo pipefail
          dart analyze --fatal-infos --fatal-warnings
          dart test packages/tensora/test --reporter expanded
          git diff --check

      - name: Commit qualified repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p1-qualification-repair.yml
          git config user.name 'Tensora Qualification Bot'
          git config user.email '120781817+eukalpia@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair changes remain to commit.'
            exit 0
          fi
          git commit -m 'fix(p1): restore cross-platform dtype qualification'
          git push origin HEAD:feature/p1-tensor-core-v2
