name: Training Test Diagnostics

on:
  push:
    branches:
      - feature/stability-100-tensor-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU PyTorch
        run: >-
          python -m pip install torch==2.13.0+cpu
          --index-url https://download.pytorch.org/whl/cpu
      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          cmake -S native -B build/training-test-diagnostics \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DTENSORA_WITH_TORCH=ON \
            -DTENSORA_BUILD_TESTS=ON \
            -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/training-test-diagnostics --parallel 2
      - name: Run verbose native tests
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/training-test-diagnostics:${{ env.LD_LIBRARY_PATH }}
        run: |
          set -o pipefail
          ctest --test-dir build/training-test-diagnostics -V \
            2>&1 | tee build/training-test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-test-diagnostics
          path: build/training-test.log
          if-no-files-found: warn
          retention-days: 1
