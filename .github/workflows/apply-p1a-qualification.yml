name: Apply P1A qualification fixes

on:
  push:
    branches:
      - feature/p1-tensor-core-v2
    paths:
      - .github/workflows/apply-p1a-qualification.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor == 'eukalpia'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v6
        with:
          ref: feature/p1-tensor-core-v2
          fetch-depth: 2

      - name: Verify expected parent revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7a429c68f11d7529ea091bf17fcb785472f27fee"

      - name: Apply qualification patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/tensora-p1a-qualification.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/tensora-p1a-qualification.patch.gz.b64 | gzip -d > /tmp/tensora-p1a-qualification.patch
          git apply --check /tmp/tensora-p1a-qualification.patch
          git apply /tmp/tensora-p1a-qualification.patch
          git diff --check

      - name: Set up Dart stable
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Verify Dart formatting and analysis
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart format --output=none --set-exit-if-changed \
            packages/tensora/integration_test/accelerator_training_integration_test.dart \
            packages/tensora/integration_test/cuda_training_integration_test.dart \
            packages/tensora/integration_test/training_integration_test.dart \
            packages/tensora/integration_test/training_soak_test.dart \
            packages/tensora/test/typed_tensor_integration_test.dart \
            packages/tensora_train/integration_test/declarative_nn_v2_integration_test.dart
          (cd packages/tensora && dart analyze --fatal-infos --fatal-warnings lib test integration_test)
          (cd packages/tensora_train && dart analyze --fatal-infos --fatal-warnings lib test integration_test)

      - name: Verify native core and sanitizers
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B build/qualification-core \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTENSORA_WITH_TORCH=OFF \
            -DTENSORA_WITH_ONNXRUNTIME=OFF \
            -DTENSORA_BUILD_TESTS=ON \
            -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/qualification-core --parallel 2
          ctest --test-dir build/qualification-core --output-on-failure

          cmake -S native -B build/qualification-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DTENSORA_ENABLE_SANITIZERS=ON \
            -DTENSORA_WITH_TORCH=OFF \
            -DTENSORA_WITH_ONNXRUNTIME=OFF \
            -DTENSORA_BUILD_TESTS=ON \
            -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/qualification-sanitizers --parallel 2
          ASAN_OPTIONS='detect_leaks=1:halt_on_error=1' \
          UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
            ctest --test-dir build/qualification-sanitizers --output-on-failure

      - name: Commit verified qualification fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-p1a-qualification.yml
          git config user.name eukalpia
          git config user.email 120781817+eukalpia@users.noreply.github.com
          git add -A
          git commit -m 'fix: qualify P1A across Dart and native matrices'
          git push origin HEAD:feature/p1-tensor-core-v2
