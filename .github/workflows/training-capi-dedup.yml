name: Training C ABI Tensor Adoption

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'ci: validate training tensor adoption helper' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/training-engine-v1
          fetch-depth: 0

      - name: Deduplicate parameter and buffer tensor adoption
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('native/src/training/training_c_api.cc')
          text = p.read_text()
          anchor = 'template <typename Unary>\nStatus RunTrainingUnary'
          helper = 'template <typename Fetch>\nStatus FetchAndInsertTrainingTensor(ts_tensor_t* out_tensor,\n                                    const char* operation,\n                                    Fetch&& fetch) {\n  if (out_tensor == nullptr) {\n    return InvalidArgument(std::string(operation) +\n                           ": output handle pointer is null");\n  }\n  *out_tensor = 0;\n  std::shared_ptr<Tensor> result;\n  Status status = fetch(&result);\n  if (!status.ok()) return status;\n  return InsertTrainingTensor(std::move(result), out_tensor);\n}\n\n'
          if text.count(anchor) != 1:
              raise SystemExit('training helper anchor mismatch')
          text = text.replace(anchor, helper + anchor, 1)

          old = '  return tensora::AbiGuard("module_parameter_at", [&] {\n    if (out_tensor == nullptr) {\n      return tensora::InvalidArgument(\n          "module_parameter_at: output handle pointer is null");\n    }\n    *out_tensor = 0;\n    std::shared_ptr<tensora::Tensor> result;\n    tensora::Status status =\n        tensora::training::ModuleParameterAt(module, index, &result);\n    if (!status.ok()) return status;\n    return tensora::InsertTrainingTensor(std::move(result), out_tensor);\n  });'
          new = '  return tensora::AbiGuard("module_parameter_at", [&] {\n    return tensora::FetchAndInsertTrainingTensor(\n        out_tensor, "module_parameter_at",\n        [&](std::shared_ptr<tensora::Tensor>* out) {\n          return tensora::training::ModuleParameterAt(module, index, out);\n        });\n  });'
          if text.count(old) != 1:
              raise SystemExit('parameter adoption block mismatch')
          text = text.replace(old, new, 1)

          old = '  return tensora::AbiGuard("module_buffer_at", [&] {\n    if (out_tensor == nullptr) {\n      return tensora::InvalidArgument(\n          "module_buffer_at: output handle pointer is null");\n    }\n    *out_tensor = 0;\n    std::shared_ptr<tensora::Tensor> result;\n    tensora::Status status =\n        tensora::training::ModuleBufferAt(module, index, &result);\n    if (!status.ok()) return status;\n    return tensora::InsertTrainingTensor(std::move(result), out_tensor);\n  });'
          new = '  return tensora::AbiGuard("module_buffer_at", [&] {\n    return tensora::FetchAndInsertTrainingTensor(\n        out_tensor, "module_buffer_at",\n        [&](std::shared_ptr<tensora::Tensor>* out) {\n          return tensora::training::ModuleBufferAt(module, index, out);\n        });\n  });'
          if text.count(old) != 1:
              raise SystemExit('buffer adoption block mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Validate Release matrix
        run: |
          cmake -S native -B build/release -DCMAKE_BUILD_TYPE=Release -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure

      - name: Validate ASan and UBSan matrix
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S native -B build/asan -DCMAKE_BUILD_TYPE=Debug -DTENSORA_ENABLE_SANITIZERS=ON -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan --output-on-failure

      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/training/training_c_api.cc
          git diff --cached --check
          git commit -m 'refactor: unify training tensor adoption'
          git push origin HEAD:feature/training-engine-v1
