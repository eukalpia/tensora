name: Allocation Guard Refactor

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'ci: validate allocation guard refactor' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/training-engine-v1
          fetch-depth: 0
      - name: Apply allocation guard refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guard = '#ifndef TENSORA_CORE_ALLOCATION_GUARD_H_\n#define TENSORA_CORE_ALLOCATION_GUARD_H_\n\n#include <new>\n#include <stdexcept>\n#include <string>\n#include <utility>\n\n#include "core/status.h"\n\nnamespace tensora {\n\ntemplate <typename Function>\nStatus AllocationGuard(const char* operation, Function&& function) noexcept {\n  try {\n    return std::forward<Function>(function)();\n  } catch (const std::bad_alloc&) {\n    return OutOfMemory(std::string(operation) + ": allocation failed");\n  } catch (const std::length_error&) {\n    return OutOfMemory(std::string(operation) + ": allocation size is too large");\n  }\n}\n\n}  // namespace tensora\n\n#endif  // TENSORA_CORE_ALLOCATION_GUARD_H_\n'
          Path('native/src/core/allocation_guard.h').write_text(guard)

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: guarded replacement expected once')
              p.write_text(text.replace(old, new, 1))

          # CPU storage: keep the crash fix while centralizing standard allocation exceptions.
          p = Path('native/src/memory/cpu_storage.cc')
          text = p.read_text()
          text = text.replace('#include <exception>\n', '')
          text = text.replace('#include "memory/cpu_storage.h"\n\n', '#include "memory/cpu_storage.h"\n\n#include "core/allocation_guard.h"\n', 1)
          old = '  try {\n    std::vector<float> values(static_cast<size_t>(numel), value);\n    *out = std::shared_ptr<CpuStorage>(new CpuStorage(std::move(values)));\n    return Status::Ok();\n  } catch (const std::exception&) {\n    return OutOfMemory("cpu storage: allocation failed");\n  }'
          new = '  return AllocationGuard("cpu storage", [&]() -> Status {\n    std::vector<float> values(static_cast<size_t>(numel), value);\n    *out = std::shared_ptr<CpuStorage>(new CpuStorage(std::move(values)));\n    return Status::Ok();\n  });'
          if text.count(old) != 1:
              raise SystemExit('cpu storage Filled block mismatch')
          text = text.replace(old, new, 1)
          old = '  try {\n    std::vector<float> values(static_cast<size_t>(numel));\n    std::copy_n(data, static_cast<size_t>(numel), values.begin());\n    *out = std::shared_ptr<CpuStorage>(new CpuStorage(std::move(values)));\n    return Status::Ok();\n  } catch (const std::exception&) {\n    return OutOfMemory("cpu storage: allocation failed");\n  }'
          new = '  return AllocationGuard("cpu storage", [&]() -> Status {\n    std::vector<float> values(static_cast<size_t>(numel));\n    std::copy_n(data, static_cast<size_t>(numel), values.begin());\n    *out = std::shared_ptr<CpuStorage>(new CpuStorage(std::move(values)));\n    return Status::Ok();\n  });'
          if text.count(old) != 1:
              raise SystemExit('cpu storage FromData block mismatch')
          p.write_text(text.replace(old, new, 1))

          p = Path('native/src/autograd/autograd.h')
          text = p.read_text()
          text = text.replace('#include "core/status.h"\n', '#include "core/allocation_guard.h"\n#include "core/status.h"\n', 1)
          old = '  try {\n    out->assign(static_cast<size_t>(tensor.numel()), 0.0f);\n  } catch (const std::bad_alloc&) {\n    return OutOfMemory(std::string(operation) +\n                       ": logical value allocation failed");\n  }'
          new = '  status = AllocationGuard(operation, [&]() -> Status {\n    out->assign(static_cast<size_t>(tensor.numel()), 0.0f);\n    return Status::Ok();\n  });\n  if (!status.ok()) return status;'
          if text.count(old) != 1:
              raise SystemExit('autograd logical allocation block mismatch')
          text = text.replace(old, new, 1)
          old = '  try {\n    *out = std::make_shared<Tensor>(std::move(materialized_shape),\n                                    std::move(storage));\n    return Status::Ok();\n  } catch (const std::bad_alloc&) {\n    return OutOfMemory("autograd: tensor allocation failed");\n  }'
          new = '  return AllocationGuard("autograd tensor", [&]() -> Status {\n    *out = std::make_shared<Tensor>(std::move(materialized_shape),\n                                    std::move(storage));\n    return Status::Ok();\n  });'
          if text.count(old) != 1:
              raise SystemExit('autograd materialized tensor block mismatch')
          text = text.replace(old, new, 1)
          old = '  try {\n    *out = std::make_shared<Tensor>(shape, std::move(storage));\n    return Status::Ok();\n  } catch (const std::bad_alloc&) {\n    return OutOfMemory("autograd: tensor allocation failed");\n  }'
          new = '  return AllocationGuard("autograd tensor", [&]() -> Status {\n    *out = std::make_shared<Tensor>(shape, std::move(storage));\n    return Status::Ok();\n  });'
          if text.count(old) != 1:
              raise SystemExit('autograd full tensor block mismatch')
          text = text.replace(old, new, 1)
          redundant = '  if (destination_values->size() != source_values.size()) {\n    return InternalError("autograd: gradient accumulation size mismatch");\n  }\n'
          if text.count(redundant) != 1:
              raise SystemExit('autograd redundant size check mismatch')
          text = text.replace(redundant, '', 1)
          redundant = '  if (written != out->size()) {\n    return InternalError(std::string(operation) +\n                         ": logical copy returned inconsistent size");\n  }\n'
          if text.count(redundant) != 1:
              raise SystemExit('autograd redundant logical copy check mismatch')
          p.write_text(text.replace(redundant, '', 1))

          p = Path('native/src/backends/cpu/cpu_backend.cc')
          text = p.read_text()
          text = text.replace('#include "autograd/autograd.h"\n', '#include "autograd/autograd.h"\n#include "core/allocation_guard.h"\n', 1)
          old = '  try {\n    *out = std::make_shared<Tensor>(std::move(materialized_shape),\n                                    std::move(storage));\n    return Status::Ok();\n  } catch (const std::bad_alloc&) {\n    return OutOfMemory("cpu backend: tensor object allocation failed");\n  }'
          new = '  return AllocationGuard("cpu backend tensor", [&]() -> Status {\n    *out = std::make_shared<Tensor>(std::move(materialized_shape),\n                                    std::move(storage));\n    return Status::Ok();\n  });'
          if text.count(old) != 1:
              raise SystemExit('cpu backend tensor block mismatch')
          text = text.replace(old, new, 1)
          old = '  try {\n    *out = std::make_shared<Tensor>(\n        std::move(shape), source.storage(), source.dtype(), source.device(),\n        source.device_index(), source.storage_offset(), source.version_counter());\n    return Status::Ok();\n  } catch (const std::bad_alloc&) {\n    return OutOfMemory("cpu backend: tensor view allocation failed");\n  }'
          new = '  return AllocationGuard("cpu backend view", [&]() -> Status {\n    *out = std::make_shared<Tensor>(\n        std::move(shape), source.storage(), source.dtype(), source.device(),\n        source.device_index(), source.storage_offset(), source.version_counter());\n    return Status::Ok();\n  });'
          if text.count(old) != 1:
              raise SystemExit('cpu backend view block mismatch')
          text = text.replace(old, new, 1)
          old = '  try {\n    out->assign(static_cast<size_t>(tensor.numel()), 0.0f);\n  } catch (const std::bad_alloc&) {\n    return OutOfMemory(std::string(operation) +\n                       ": logical value buffer allocation failed");\n  }'
          new = '  status = AllocationGuard(operation, [&]() -> Status {\n    out->assign(static_cast<size_t>(tensor.numel()), 0.0f);\n    return Status::Ok();\n  });\n  if (!status.ok()) return status;'
          if text.count(old) != 1:
              raise SystemExit('cpu backend logical allocation block mismatch')
          p.write_text(text.replace(old, new, 1))

          p = Path('native/tests/training_core_internal_test.cc')
          text = p.read_text()
          text = text.replace('#include "core/status.h"\n', '#include "core/allocation_guard.h"\n#include "core/status.h"\n', 1)
          anchor = 'void TestDirectArgumentContracts() {'
          block = 'void TestAllocationGuardContracts() {\n  using tensora::AllocationGuard;\n  using tensora::Status;\n\n  CHECK_STATUS(AllocationGuard("alloc_ok", [] { return Status::Ok(); }), TS_OK);\n  CHECK_STATUS(AllocationGuard("alloc_bad", []() -> Status { throw std::bad_alloc(); }),\n               TS_OUT_OF_MEMORY);\n  CHECK_STATUS(AllocationGuard("alloc_length", []() -> Status {\n                 throw std::length_error("too large");\n               }),\n               TS_OUT_OF_MEMORY);\n}\n\n'
          if text.count(anchor) != 1:
              raise SystemExit('allocation test anchor mismatch')
          text = text.replace(anchor, block + anchor, 1)
          main = '  TestDirectArgumentContracts();\n'
          if text.count(main) != 1:
              raise SystemExit('allocation test main anchor mismatch')
          p.write_text(text.replace(main, '  TestAllocationGuardContracts();\n' + main, 1))
          PY
          git diff --check
      - name: Validate Release matrix
        run: |
          cmake -S native -B build/release -DCMAKE_BUILD_TYPE=Release -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure
      - name: Validate ASan and UBSan matrix
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S native -B build/asan -DCMAKE_BUILD_TYPE=Debug -DTENSORA_ENABLE_SANITIZERS=ON -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan --output-on-failure
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/core/allocation_guard.h native/src/memory/cpu_storage.cc native/src/autograd/autograd.h native/src/backends/cpu/cpu_backend.cc native/tests/training_core_internal_test.cc
          git diff --cached --check
          git commit -m 'refactor: centralize allocation failure handling'
          git push origin HEAD:feature/training-engine-v1
