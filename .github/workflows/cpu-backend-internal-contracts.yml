name: CPU Backend Internal Contracts

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'ci: validate cpu backend internal contracts' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/training-engine-v1
          fetch-depth: 0

      - name: Expose and test internal CPU backend contracts
        shell: bash
        env:
          HEADER_B64: 
          FUNC_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path

          Path('native/src/backends/cpu/cpu_backend_internal.h').write_text(
              base64.b64decode(os.environ['HEADER_B64']).decode())

          p = Path('native/src/backends/cpu/cpu_backend.cc')
          text = p.read_text()
          include = '#include "backends/cpu/cpu_backend.h"\n'
          if text.count(include) != 1:
              raise SystemExit('cpu backend include anchor mismatch')
          text = text.replace(include, include + '#include "backends/cpu/cpu_backend_internal.h"\n', 1)
          marker = 'namespace tensora {\nnamespace {\n'
          if text.count(marker) != 1:
              raise SystemExit('cpu backend namespace anchor mismatch')
          text = text.replace(marker, 'namespace tensora {\nnamespace cpu_backend_internal {\n', 1)
          redundant = '  if (written != out->size()) {\n    return InternalError(std::string(operation) +\n                         ": logical copy returned inconsistent size");\n  }\n'
          if text.count(redundant) != 1:
              raise SystemExit('cpu backend redundant logical check mismatch')
          text = text.replace(redundant, '', 1)
          close = '}  // namespace\n\nStatus CpuBackend::FromData'
          replacement = '}  // namespace cpu_backend_internal\n\nusing cpu_backend_internal::EnsureCpuFloat32;\nusing cpu_backend_internal::LogicalValues;\nusing cpu_backend_internal::MakeTensor;\nusing cpu_backend_internal::MakeView;\n\nStatus CpuBackend::FromData'
          if text.count(close) != 1:
              raise SystemExit('cpu backend namespace close mismatch')
          p.write_text(text.replace(close, replacement, 1))

          p = Path('native/src/autograd/autograd.h')
          text = p.read_text()
          redundant = '  if (written != out->size()) {\n    return InternalError(std::string(operation) +\n                         ": logical copy returned inconsistent size");\n  }\n'
          if text.count(redundant) != 1:
              raise SystemExit('autograd redundant logical check mismatch')
          p.write_text(text.replace(redundant, '', 1))

          p = Path('native/tests/training_core_internal_test.cc')
          text = p.read_text()
          include_anchor = '#include "backends/cpu/cpu_backend.h"\n'
          if text.count(include_anchor) != 1:
              raise SystemExit('training internal include anchor mismatch')
          text = text.replace(include_anchor,
                              include_anchor + '#include "backends/cpu/cpu_backend_internal.h"\n', 1)
          func = base64.b64decode(os.environ['FUNC_B64']).decode()
          anchor = 'void TestDirectArgumentContracts() {'
          if text.count(anchor) != 1:
              raise SystemExit('training internal function anchor mismatch')
          text = text.replace(anchor, func + '\n\n' + anchor, 1)
          call = '  TestDirectArgumentContracts();\n'
          if text.count(call) != 1:
              raise SystemExit('training internal main anchor mismatch')
          p.write_text(text.replace(call, '  TestCpuBackendInternalContracts();\n' + call, 1))
          PY
          git diff --check

      - name: Validate Release matrix
        run: |
          cmake -S native -B build/release -DCMAKE_BUILD_TYPE=Release -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure

      - name: Validate ASan and UBSan matrix
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S native -B build/asan -DCMAKE_BUILD_TYPE=Debug -DTENSORA_ENABLE_SANITIZERS=ON -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan --output-on-failure

      - name: Commit validated contracts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/backends/cpu/cpu_backend_internal.h native/src/backends/cpu/cpu_backend.cc native/src/autograd/autograd.h native/tests/training_core_internal_test.cc
          git diff --cached --check
          git commit -m 'test: expose CPU backend invariants'
          git push origin HEAD:feature/training-engine-v1
