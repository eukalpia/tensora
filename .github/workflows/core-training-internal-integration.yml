name: Core Training Internal Integration

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: write

concurrency:
  group: core-training-internal-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'ci: validate core training internal integration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/training-engine-v1
          fetch-depth: 0

      - name: Register internal core training contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('native/CMakeLists.txt')
          text = p.read_text()

          old = '''    add_executable(tensora_optimizer_checkpoint_tests
      tests/optimizer_checkpoint_test.cc
    )
    target_include_directories(tensora_optimizer_checkpoint_tests PRIVATE
      ${CMAKE_CURRENT_SOURCE_DIR}/include
    )
    target_link_libraries(tensora_optimizer_checkpoint_tests PRIVATE tensora_native)
  endif()
'''
          new = '''    add_executable(tensora_optimizer_checkpoint_tests
      tests/optimizer_checkpoint_test.cc
    )
    target_include_directories(tensora_optimizer_checkpoint_tests PRIVATE
      ${CMAKE_CURRENT_SOURCE_DIR}/include
    )
    target_link_libraries(tensora_optimizer_checkpoint_tests PRIVATE tensora_native)

    add_executable(tensora_training_core_internal_tests
      tests/training_core_internal_test.cc
      src/backends/cpu/cpu_backend.cc
      src/core/status.cc
      src/memory/cpu_storage.cc
      src/runtime/dispatcher.cc
      src/runtime/handle_registry.cc
      src/tensor/shape.cc
      src/tensor/tensor.cc
      src/training/training_bridge_stub.cc
    )
    target_compile_features(tensora_training_core_internal_tests PRIVATE cxx_std_20)
    target_include_directories(tensora_training_core_internal_tests PRIVATE
      ${CMAKE_CURRENT_SOURCE_DIR}/include
      ${CMAKE_CURRENT_SOURCE_DIR}/src
    )
    target_link_libraries(tensora_training_core_internal_tests PRIVATE Threads::Threads)
  endif()
'''
          if text.count(old) != 1:
              raise SystemExit('core training target insertion point mismatch')
          text = text.replace(old, new, 1)

          old = '''      target_compile_options(tensora_training_abi_contract_tests PRIVATE /W4 /WX /permissive-)
      target_compile_options(tensora_optimizer_checkpoint_tests PRIVATE /W4 /WX /permissive-)
'''
          new = old + '''      target_compile_options(tensora_training_core_internal_tests PRIVATE /W4 /WX /permissive-)
'''
          if text.count(old) != 1:
              raise SystemExit('MSVC core training flags insertion point mismatch')
          text = text.replace(old, new, 1)

          old = '''      target_compile_options(tensora_training_abi_contract_tests PRIVATE -Wall -Wextra -Wpedantic -Werror)
      target_compile_options(tensora_optimizer_checkpoint_tests PRIVATE -Wall -Wextra -Wpedantic -Werror)
'''
          new = old + '''      target_compile_options(tensora_training_core_internal_tests PRIVATE -Wall -Wextra -Wpedantic -Werror)
'''
          if text.count(old) != 1:
              raise SystemExit('Unix core training flags insertion point mismatch')
          text = text.replace(old, new, 1)

          old = '''      target_compile_options(tensora_optimizer_checkpoint_tests PRIVATE ${TENSORA_SANITIZER_FLAGS})
      target_link_options(tensora_optimizer_checkpoint_tests PRIVATE -fsanitize=address,undefined)
'''
          new = old + '''      target_compile_options(tensora_training_core_internal_tests PRIVATE ${TENSORA_SANITIZER_FLAGS})
      target_link_options(tensora_training_core_internal_tests PRIVATE -fsanitize=address,undefined)
'''
          if text.count(old) != 1:
              raise SystemExit('sanitizer core training flags insertion point mismatch')
          text = text.replace(old, new, 1)

          old = '''      target_compile_options(tensora_optimizer_checkpoint_tests PRIVATE ${TENSORA_THREAD_SANITIZER_FLAGS})
      target_link_options(tensora_optimizer_checkpoint_tests PRIVATE -fsanitize=thread)
'''
          new = old + '''      target_compile_options(tensora_training_core_internal_tests PRIVATE ${TENSORA_THREAD_SANITIZER_FLAGS})
      target_link_options(tensora_training_core_internal_tests PRIVATE -fsanitize=thread)
'''
          if text.count(old) != 1:
              raise SystemExit('TSan core training flags insertion point mismatch')
          text = text.replace(old, new, 1)

          old = '''    add_test(NAME tensora_training_abi_contract_tests COMMAND tensora_training_abi_contract_tests)
    add_test(NAME tensora_optimizer_checkpoint_tests COMMAND tensora_optimizer_checkpoint_tests)
'''
          new = old + '''    add_test(NAME tensora_training_core_internal_tests COMMAND tensora_training_core_internal_tests)
'''
          if text.count(old) != 1:
              raise SystemExit('CTest core training registration insertion point mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Validate Release matrix
        shell: bash
        run: |
          cmake -S native -B build/release -DCMAKE_BUILD_TYPE=Release -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure

      - name: Validate ASan and UBSan matrix
        shell: bash
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S native -B build/asan -DCMAKE_BUILD_TYPE=Debug -DTENSORA_ENABLE_SANITIZERS=ON -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan --output-on-failure

      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/CMakeLists.txt
          git diff --cached --check
          git commit -m 'test: register core training internal contracts'
          git push origin HEAD:feature/training-engine-v1
