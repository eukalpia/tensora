name: Source Snapshot

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: read

concurrency:
  group: source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preserve source tree
        uses: actions/upload-artifact@v4
        with:
          name: tensora-source-${{ github.sha }}
          path: |
            native
            packages
            tools
            pubspec.yaml
            melos.yaml
          if-no-files-found: error
          retention-days: 1
