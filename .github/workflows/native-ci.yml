name: Native CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'perf/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-platform:
    name: Native ${{ matrix.os }} / ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure native runtime
        run: >-
          cmake -S native -B build/native
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTENSORA_BUILD_TESTS=ON
          -DTENSORA_BUILD_BENCHMARKS=ON

      - name: Build native runtime
        run: cmake --build build/native --config ${{ matrix.build_type }} --parallel

      - name: Run native tests
        run: ctest --test-dir build/native --build-config ${{ matrix.build_type }} --output-on-failure

      - name: Run benchmark smoke on Unix
        if: matrix.build_type == 'Release' && runner.os != 'Windows'
        run: ./build/native/tensora_native_benchmark --smoke

      - name: Run benchmark smoke on Windows
        if: matrix.build_type == 'Release' && runner.os == 'Windows'
        run: .\build\native\Release\tensora_native_benchmark.exe --smoke

  native-sanitizers:
    name: Native ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure sanitizer build
        env:
          CXX: clang++
        run: >-
          cmake -S native -B build/sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DTENSORA_ENABLE_SANITIZERS=ON
          -DTENSORA_BUILD_TESTS=ON
          -DTENSORA_BUILD_BENCHMARKS=OFF

      - name: Build sanitizer runtime
        run: cmake --build build/sanitizers --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers --output-on-failure
