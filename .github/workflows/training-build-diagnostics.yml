name: Training Build Diagnostics

on:
  push:
    branches:
      - feature/stability-100-tensor-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU PyTorch
        run: >-
          python -m pip install torch==2.13.0+cpu
          --index-url https://download.pytorch.org/whl/cpu
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          cmake -S native -B build/training-diagnostics \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DTENSORA_WITH_TORCH=ON \
            -DTENSORA_BUILD_TESTS=ON \
            -DTENSORA_BUILD_BENCHMARKS=OFF
      - name: Build with full diagnostics
        shell: bash
        run: |
          set -o pipefail
          cmake --build build/training-diagnostics --parallel 2 --verbose \
            2>&1 | tee build/training-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-build-diagnostics
          path: build/training-build.log
          if-no-files-found: warn
          retention-days: 1
