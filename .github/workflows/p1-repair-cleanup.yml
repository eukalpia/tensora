name: P1 Repair Cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - feature/p1-tensor-core-v2

permissions:
  contents: write

concurrency:
  group: p1-repair-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout P1 branch
        uses: actions/checkout@v6
        with:
          ref: feature/p1-tensor-core-v2
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Require repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TS_API ts_status_t ts_tensor_from_host' native/src/tensor/tensor.cc
          grep -q 'TS_API ts_status_t ts_tensor_full' native/src/tensor/tensor.cc
          grep -q 'TS_API ts_status_t ts_tensor_cast' native/src/tensor/tensor.cc
          grep -q 'TS_API ts_status_t ts_tensor_copy_to_host' native/src/tensor/tensor.cc
          grep -q 'ts_abi_version_is_6' native/tests/dtype_abi_contract_test.c
          grep -q 'TS_ABI_VERSION == 6u' native/tests/dtype_abi_contract_test.c

      - name: Verify native and public ABI gates
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B build/p1-cleanup \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTENSORA_BUILD_TESTS=ON \
            -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/p1-cleanup --parallel 2
          ctest --test-dir build/p1-cleanup --output-on-failure
          cc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Wpedantic \
            -Werror \
            -Inative/include \
            native/tests/dtype_abi_contract_test.c \
            -o build/p1-cleanup/dtype-abi-contract
          ./build/p1-cleanup/dtype-abi-contract

      - name: Verify Dart gates
        shell: bash
        env:
          TENSORA_NATIVE_LIBRARY: ${{ github.workspace }}/build/p1-cleanup/libtensora_native.so
        run: |
          set -euo pipefail
          dart pub get
          (
            cd packages/tensora
            dart format --output=none --set-exit-if-changed lib test benchmark
            dart analyze --fatal-infos --fatal-warnings
            dart test --reporter expanded
          )
          git diff --check

      - name: Remove temporary qualification workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tensora Qualification Bot'
          git config user.email '120781817+eukalpia@users.noreply.github.com'
          git rm \
            .github/workflows/p1-qualification-repair.yml \
            .github/workflows/p1-repair-cleanup.yml
          git commit -m 'ci(p1): remove temporary qualification repair'
          git push origin HEAD:feature/p1-tensor-core-v2
