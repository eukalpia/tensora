name: ABI Guard Refactor

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'ci: validate abi guard refactor' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/training-engine-v1
          fetch-depth: 0

      - name: Apply ABI guard refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guard = '''#ifndef TENSORA_CORE_ABI_GUARD_H_\n#define TENSORA_CORE_ABI_GUARD_H_\n\n#include <exception>\n#include <new>\n#include <string>\n#include <utility>\n\n#include "core/status.h"\n\nnamespace tensora {\n\ntemplate <typename Function>\nts_status_t AbiGuard(const char* operation, Function&& function) noexcept {\n  ClearLastError();\n  try {\n    Status status = std::forward<Function>(function)();\n    if (!status.ok()) {\n      if (status.message().empty()) {\n        status = Status(status.code(), std::string(operation) + ": failed");\n      }\n      SetLastError(status);\n    }\n    return status.code();\n  } catch (const std::bad_alloc&) {\n    const Status status =\n        OutOfMemory(std::string(operation) + ": native allocation failed");\n    SetLastError(status);\n    return status.code();\n  } catch (const std::exception& error) {\n    const Status status =\n        InternalError(std::string(operation) + ": " + error.what());\n    SetLastError(status);\n    return status.code();\n  } catch (...) {\n    const Status status =\n        InternalError(std::string(operation) + ": unknown native exception");\n    SetLastError(status);\n    return status.code();\n  }\n}\n\n}  // namespace tensora\n\n#endif  // TENSORA_CORE_ABI_GUARD_H_\n'''
          Path('native/src/core/abi_guard.h').write_text(guard)

          for path, name in [
              ('native/src/c_api.cc', 'GuardedAbiCall'),
              ('native/src/training/training_c_api.cc', 'GuardedTrainingAbiCall'),
              ('native/src/inference/inference_c_api.cc', 'GuardedInferenceAbiCall'),
          ]:
              file = Path(path)
              text = file.read_text()
              status_include = '#include "core/status.h"\n'
              if text.count(status_include) != 1:
                  raise SystemExit(f'{path}: status include mismatch')
              text = text.replace(status_include,
                                  '#include "core/abi_guard.h"\n' + status_include,
                                  1)
              namespace_start = text.index('namespace {')
              start = text.index('template <typename Function>\n', namespace_start)
              end = text.index('\n}\n\nStatus ', start) + 2
              text = text[:start] + text[end + 1:]
              if name not in text:
                  raise SystemExit(f'{path}: guard call name missing')
              text = text.replace(name + '(', 'AbiGuard(')
              file.write_text(text)

          test = Path('native/tests/handle_registry_test.cc')
          text = test.read_text()
          include_anchor = '#include "backends/cpu/cpu_backend.h"\n'
          if text.count(include_anchor) != 1:
              raise SystemExit('handle registry include anchor mismatch')
          text = text.replace(include_anchor,
                              include_anchor + '#include "core/abi_guard.h"\n', 1)

          function = '''\nint TestAbiGuardContracts() {\n  using tensora::AbiGuard;\n  using tensora::InvalidArgument;\n  using tensora::Status;\n\n  if (AbiGuard("abi_ok", [] { return Status::Ok(); }) != TS_OK) return 201;\n  if (AbiGuard("abi_empty", [] { return Status(TS_INVALID_ARGUMENT, ""); }) !=\n      TS_INVALID_ARGUMENT)\n    return 202;\n  if (std::string(tensora::LastErrorMessage()) != "abi_empty: failed") return 203;\n  if (AbiGuard("abi_error", [] { return InvalidArgument("bad input"); }) !=\n      TS_INVALID_ARGUMENT)\n    return 204;\n  if (std::string(tensora::LastErrorMessage()) != "bad input") return 205;\n  if (AbiGuard("abi_alloc", []() -> Status { throw std::bad_alloc(); }) !=\n      TS_OUT_OF_MEMORY)\n    return 206;\n  if (std::string(tensora::LastErrorMessage()).find("native allocation failed") ==\n      std::string::npos)\n    return 207;\n  if (AbiGuard("abi_std", []() -> Status { throw std::runtime_error("boom"); }) !=\n      TS_INTERNAL_ERROR)\n    return 208;\n  if (std::string(tensora::LastErrorMessage()).find("boom") ==\n      std::string::npos)\n    return 209;\n  if (AbiGuard("abi_unknown", []() -> Status { throw 7; }) !=\n      TS_INTERNAL_ERROR)\n    return 210;\n  if (std::string(tensora::LastErrorMessage()).find("unknown native exception") ==\n      std::string::npos)\n    return 211;\n  return 0;\n}\n\n'''
          function_anchor = 'int TestRegistryContracts() {'
          if text.count(function_anchor) != 1:
              raise SystemExit('handle registry function anchor mismatch')
          text = text.replace(function_anchor, function + function_anchor, 1)
          main_old = '''int main() {\n  const int registry = TestRegistryContracts();\n  if (registry != 0) return registry;\n  return TestCoreContracts();\n}'''
          main_new = '''int main() {\n  const int abi_guard = TestAbiGuardContracts();\n  if (abi_guard != 0) return abi_guard;\n  const int registry = TestRegistryContracts();\n  if (registry != 0) return registry;\n  return TestCoreContracts();\n}'''
          if text.count(main_old) != 1:
              raise SystemExit('handle registry main anchor mismatch')
          test.write_text(text.replace(main_old, main_new, 1))
          PY
          git diff --check

      - name: Validate Release matrix
        run: |
          cmake -S native -B build/release -DCMAKE_BUILD_TYPE=Release -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure

      - name: Validate ASan and UBSan matrix
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S native -B build/asan -DCMAKE_BUILD_TYPE=Debug -DTENSORA_ENABLE_SANITIZERS=ON -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan --output-on-failure

      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/core/abi_guard.h native/src/c_api.cc native/src/training/training_c_api.cc native/src/inference/inference_c_api.cc native/tests/handle_registry_test.cc
          git diff --cached --check
          git commit -m 'refactor: centralize ABI exception containment'
          git push origin HEAD:feature/training-engine-v1
