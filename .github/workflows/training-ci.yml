name: Training CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'perf/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-cpu:
    name: LibTorch CPU training
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned CPU PyTorch
        run: >-
          python -m pip install
          torch==2.13.0+cpu
          --index-url https://download.pytorch.org/whl/cpu

      - name: Record PyTorch environment
        shell: bash
        run: |
          python - <<'PY'
          import torch
          print('torch_version=' + torch.__version__)
          print('torch_cmake_prefix=' + torch.utils.cmake_prefix_path)
          print('cuda_available=' + str(torch.cuda.is_available()))
          print('cuda_device_count=' + str(torch.cuda.device_count()))
          PY

      - name: Resolve LibTorch CMake prefix
        shell: bash
        run: |
          echo "TORCH_CMAKE_PREFIX=$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')" >> "$GITHUB_ENV"

      - name: Configure training-enabled runtime
        shell: bash
        run: >-
          cmake -S native -B build/training
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$TORCH_CMAKE_PREFIX"
          -DTENSORA_WITH_TORCH=ON
          -DTENSORA_BUILD_TESTS=ON
          -DTENSORA_BUILD_BENCHMARKS=OFF

      - name: Build training-enabled runtime
        run: cmake --build build/training --config Release --parallel 2

      - name: Run native training acceptance suite
        run: ctest --test-dir build/training --build-config Release --output-on-failure
