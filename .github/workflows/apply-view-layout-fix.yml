name: Tensor View Layout Repair

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: write

concurrency:
  group: tensor-view-layout-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.event.head_commit.message == 'ci: validate tensor view layout repair'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/training-engine-v1
          fetch-depth: 0

      - name: Apply guarded production repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: guarded replacement expected exactly once')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'native/src/c_api.cc',
              '''    status = object->storage()->CopyToHostF32(\n        out_values, capacity, out_written);''',
              '''    status = object->CopyToHostF32(out_values, capacity, out_written);''',
          )

          replace_once(
              'native/src/autograd/autograd.h',
              '''  if (values.size() != static_cast<size_t>(shape.numel)) {\n    return InternalError("autograd: gradient value count does not match shape");\n  }\n  std::shared_ptr<CpuStorage> storage;\n  Status status = CpuStorage::FromData(values.data(), shape.numel, &storage);\n  if (!status.ok()) return status;\n  try {\n    *out = std::make_shared<Tensor>(shape, std::move(storage));\n    return Status::Ok();\n''',
              '''  if (values.size() != static_cast<size_t>(shape.numel)) {\n    return InternalError("autograd: gradient value count does not match shape");\n  }\n\n  ShapeInfo materialized_shape;\n  const int64_t* dimensions =\n      shape.dimensions.empty() ? nullptr : shape.dimensions.data();\n  Status status =\n      ValidateShape(dimensions, shape.dimensions.size(), &materialized_shape);\n  if (!status.ok() || materialized_shape.numel != shape.numel) {\n    return InternalError(\n        "autograd: could not canonicalize materialized gradient shape");\n  }\n\n  std::shared_ptr<CpuStorage> storage;\n  status = CpuStorage::FromData(values.data(), shape.numel, &storage);\n  if (!status.ok()) return status;\n  try {\n    *out = std::make_shared<Tensor>(std::move(materialized_shape),\n                                    std::move(storage));\n    return Status::Ok();\n''',
          )

          replace_once(
              'native/src/backends/cpu/cpu_backend.cc',
              '''Status MakeTensor(ShapeInfo shape,\n                  std::shared_ptr<CpuStorage> storage,\n                  std::shared_ptr<Tensor>* out) {\n  if (out == nullptr) {\n    return InvalidArgument("cpu backend: output tensor pointer is null");\n  }\n  try {\n    *out = std::make_shared<Tensor>(std::move(shape), std::move(storage));\n    return Status::Ok();\n''',
              '''Status MakeTensor(ShapeInfo shape,\n                  std::shared_ptr<CpuStorage> storage,\n                  std::shared_ptr<Tensor>* out) {\n  if (out == nullptr) {\n    return InvalidArgument("cpu backend: output tensor pointer is null");\n  }\n  if (!storage) {\n    return InvalidArgument("cpu backend: materialized tensor storage is null");\n  }\n\n  ShapeInfo materialized_shape;\n  const int64_t* dimensions =\n      shape.dimensions.empty() ? nullptr : shape.dimensions.data();\n  Status status =\n      ValidateShape(dimensions, shape.dimensions.size(), &materialized_shape);\n  if (!status.ok() || materialized_shape.numel != shape.numel ||\n      storage->numel() != shape.numel) {\n    return InternalError(\n        "cpu backend: materialized tensor shape/storage contract is invalid");\n  }\n\n  try {\n    *out = std::make_shared<Tensor>(std::move(materialized_shape),\n                                    std::move(storage));\n    return Status::Ok();\n''',
          )

          cmake = Path('native/CMakeLists.txt')
          text = cmake.read_text()
          replacements = [
              (
                  '''  add_executable(tensora_autograd_finite_difference_tests\n    tests/autograd_finite_difference_test.cc\n  )\n  target_include_directories(tensora_autograd_finite_difference_tests PRIVATE\n    ${CMAKE_CURRENT_SOURCE_DIR}/include\n  )\n  target_link_libraries(tensora_autograd_finite_difference_tests PRIVATE tensora_native)\n''',
                  '''  add_executable(tensora_autograd_finite_difference_tests\n    tests/autograd_finite_difference_test.cc\n  )\n  target_include_directories(tensora_autograd_finite_difference_tests PRIVATE\n    ${CMAKE_CURRENT_SOURCE_DIR}/include\n  )\n  target_link_libraries(tensora_autograd_finite_difference_tests PRIVATE tensora_native)\n\n  add_executable(tensora_tensor_view_tests tests/tensor_view_test.cc)\n  target_include_directories(tensora_tensor_view_tests PRIVATE\n    ${CMAKE_CURRENT_SOURCE_DIR}/include\n  )\n  target_link_libraries(tensora_tensor_view_tests PRIVATE tensora_native)\n''',
              ),
              (
                  '''    target_compile_options(tensora_autograd_finite_difference_tests PRIVATE /W4 /WX /permissive-)\n''',
                  '''    target_compile_options(tensora_autograd_finite_difference_tests PRIVATE /W4 /WX /permissive-)\n    target_compile_options(tensora_tensor_view_tests PRIVATE /W4 /WX /permissive-)\n''',
              ),
              (
                  '''    target_compile_options(tensora_autograd_finite_difference_tests PRIVATE -Wall -Wextra -Wpedantic -Werror)\n''',
                  '''    target_compile_options(tensora_autograd_finite_difference_tests PRIVATE -Wall -Wextra -Wpedantic -Werror)\n    target_compile_options(tensora_tensor_view_tests PRIVATE -Wall -Wextra -Wpedantic -Werror)\n''',
              ),
              (
                  '''    target_compile_options(tensora_autograd_finite_difference_tests PRIVATE ${TENSORA_SANITIZER_FLAGS})\n    target_link_options(tensora_autograd_finite_difference_tests PRIVATE -fsanitize=address,undefined)\n''',
                  '''    target_compile_options(tensora_autograd_finite_difference_tests PRIVATE ${TENSORA_SANITIZER_FLAGS})\n    target_link_options(tensora_autograd_finite_difference_tests PRIVATE -fsanitize=address,undefined)\n    target_compile_options(tensora_tensor_view_tests PRIVATE ${TENSORA_SANITIZER_FLAGS})\n    target_link_options(tensora_tensor_view_tests PRIVATE -fsanitize=address,undefined)\n''',
              ),
              (
                  '''    target_compile_options(tensora_autograd_finite_difference_tests PRIVATE ${TENSORA_THREAD_SANITIZER_FLAGS})\n    target_link_options(tensora_autograd_finite_difference_tests PRIVATE -fsanitize=thread)\n''',
                  '''    target_compile_options(tensora_autograd_finite_difference_tests PRIVATE ${TENSORA_THREAD_SANITIZER_FLAGS})\n    target_link_options(tensora_autograd_finite_difference_tests PRIVATE -fsanitize=thread)\n    target_compile_options(tensora_tensor_view_tests PRIVATE ${TENSORA_THREAD_SANITIZER_FLAGS})\n    target_link_options(tensora_tensor_view_tests PRIVATE -fsanitize=thread)\n''',
              ),
              (
                  '''  add_test(NAME tensora_autograd_finite_difference_tests COMMAND tensora_autograd_finite_difference_tests)\n''',
                  '''  add_test(NAME tensora_autograd_finite_difference_tests COMMAND tensora_autograd_finite_difference_tests)\n  add_test(NAME tensora_tensor_view_tests COMMAND tensora_tensor_view_tests)\n''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('native/CMakeLists.txt: guarded replacement expected exactly once')
              text = text.replace(old, new, 1)
          cmake.write_text(text)
          PY

      - name: Validate Release matrix
        shell: bash
        run: |
          cmake -S native -B build/release -DCMAKE_BUILD_TYPE=Release -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=ON
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure

      - name: Validate Debug matrix
        shell: bash
        run: |
          cmake -S native -B build/debug -DCMAKE_BUILD_TYPE=Debug -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/debug --parallel 2
          ctest --test-dir build/debug --output-on-failure

      - name: Validate ASan and UBSan matrix
        shell: bash
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S native -B build/asan -DCMAKE_BUILD_TYPE=Debug -DTENSORA_ENABLE_SANITIZERS=ON -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan --output-on-failure

      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/CMakeLists.txt native/src/c_api.cc native/src/autograd/autograd.h native/src/backends/cpu/cpu_backend.cc
          git diff --cached --check
          git commit -m 'fix: canonicalize materialized tensor layouts'
          git push origin HEAD:feature/training-engine-v1
