name: DType Assurance Transfer

on:
  push:
    branches:
      - work/dtype-abi-transfer-20260814
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dtype-assurance-transfer
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat transfer/dtype-abi-assurance.part-*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/dtype-abi-assurance.patch
          echo "6c076a9ea56ce312e226084fd82e82b4b5fe260bae2fafe8643c11fd4e64fe88  /tmp/dtype-abi-assurance.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/dtype-abi-assurance.patch

      - name: Publish code and tests to staging
        shell: bash
        run: |
          set -euo pipefail
          base_sha="3bf88f5014fb46fe2167434c0093ad9031e173ea"
          target_ref="refs/heads/work/dtype-abi-published-20260814"
          git config user.name "Tensora Maintainer"
          git config user.email "120781817+eukalpia@users.noreply.github.com"
          git reset --hard "$base_sha"
          git apply /tmp/dtype-abi-assurance.patch
          git checkout "$base_sha" -- .github/workflows/high-assurance-ci.yml
          git add --all
          git diff --cached --check
          git commit -m "Establish dtype semantics and ABI fault contracts"
          git push origin "HEAD:${target_ref}" \
            --force-with-lease="${target_ref}:${base_sha}"
