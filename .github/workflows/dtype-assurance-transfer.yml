name: DType Assurance Transfer

on:
  push:
    branches:
      - work/dtype-abi-transfer-20260814
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dtype-assurance-transfer
  cancel-in-progress: false

jobs:
  publish:
    name: Create verified release-candidate object
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat transfer/dtype-abi-assurance.part-*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/dtype-abi-assurance.patch
          echo "6c076a9ea56ce312e226084fd82e82b4b5fe260bae2fafe8643c11fd4e64fe88  /tmp/dtype-abi-assurance.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/dtype-abi-assurance.patch

      - name: Create exact final Git objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_sha="3bf88f5014fb46fe2167434c0093ad9031e173ea"
          staging_sha="d76c9572d49e18b929202bc32b502a0366eca6f0"

          git reset --hard "$base_sha"
          git apply /tmp/dtype-abi-assurance.patch
          git diff --check

          expected_workflow_sha="9cb8f6af449cdd86fd6e5b199fa007309470583f4aa2d6a0b0eb92752c1221f9"
          echo "${expected_workflow_sha}  .github/workflows/high-assurance-ci.yml" \
            | sha256sum --check --strict

          workflow_content="$(base64 -w0 .github/workflows/high-assurance-ci.yml)"
          workflow_blob="$({
            jq -n --arg content "$workflow_content" \
              '{content: $content, encoding: "base64"}'
          } | gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/blobs" \
              --input - \
              --jq '.sha')"

          staging_tree="$(git rev-parse "${staging_sha}^{tree}")"
          final_tree="$({
            jq -n \
              --arg base_tree "$staging_tree" \
              --arg workflow_blob "$workflow_blob" \
              '{
                base_tree: $base_tree,
                tree: [{
                  path: ".github/workflows/high-assurance-ci.yml",
                  mode: "100644",
                  type: "blob",
                  sha: $workflow_blob
                }]
              }'
          } | gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/trees" \
              --input - \
              --jq '.sha')"

          final_commit="$({
            jq -n \
              --arg message "Establish dtype semantics and 99.9% ABI assurance" \
              --arg tree "$final_tree" \
              --arg parent "$base_sha" \
              '{message: $message, tree: $tree, parents: [$parent]}'
          } | gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/commits" \
              --input - \
              --jq '.sha')"

          printf '%s\n' "$final_commit" | tee /tmp/final-commit-sha.txt
          echo "FINAL_COMMIT_SHA=${final_commit}" >> "$GITHUB_ENV"

      - name: Upload final commit reference
        uses: actions/upload-artifact@v4
        with:
          name: dtype-abi-final-commit
          path: /tmp/final-commit-sha.txt
          if-no-files-found: error
          retention-days: 1
