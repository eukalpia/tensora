name: DType Assurance Transfer

on:
  push:
    branches:
      - work/dtype-abi-transfer-20260814
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dtype-assurance-transfer
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified workflow blob
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat transfer/dtype-abi-assurance.part-*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/dtype-abi-assurance.patch
          echo "6c076a9ea56ce312e226084fd82e82b4b5fe260bae2fafe8643c11fd4e64fe88  /tmp/dtype-abi-assurance.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/dtype-abi-assurance.patch

      - name: Publish verified workflow bytes as a normal blob
        shell: bash
        run: |
          set -euo pipefail
          base_sha="3bf88f5014fb46fe2167434c0093ad9031e173ea"
          staging_sha="d76c9572d49e18b929202bc32b502a0366eca6f0"
          target_ref="refs/heads/work/dtype-abi-published-20260814"

          git config user.name "Tensora Maintainer"
          git config user.email "120781817+eukalpia@users.noreply.github.com"

          git reset --hard "$base_sha"
          git apply /tmp/dtype-abi-assurance.patch
          echo "9cb8f6af449cdd86fd6e5b199fa007309470583f4aa2d6a0b0eb92752c1221f9  .github/workflows/high-assurance-ci.yml" \
            | sha256sum --check --strict
          cp .github/workflows/high-assurance-ci.yml /tmp/final-high-assurance-ci.yml

          git reset --hard "$staging_sha"
          git clean -fd
          git checkout -B dtype-abi-staging "$staging_sha"
          mkdir -p transfer
          cp /tmp/final-high-assurance-ci.yml transfer/final-high-assurance-ci.yml
          git add transfer/final-high-assurance-ci.yml
          git diff --cached --check
          git commit -m "Stage verified High Assurance workflow blob"
          git push origin "HEAD:${target_ref}" \
            --force-with-lease="${target_ref}:${staging_sha}"
