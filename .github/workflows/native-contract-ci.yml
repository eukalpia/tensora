name: Native Contract CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Dart and native boundary contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        working-directory: packages/tensora
        run: dart pub get

      - name: Run native contract suite
        run: bash tools/collect_contract_coverage.sh

      - name: Upload contract coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-contract-coverage
          path: packages/tensora/coverage/native-contract.info
          if-no-files-found: warn
          retention-days: 7
