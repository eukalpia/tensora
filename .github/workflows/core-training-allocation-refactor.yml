name: Core Training Allocation Refactor

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'ci: validate core training allocation refactor' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/training-engine-v1
          fetch-depth: 0
      - name: Apply core training allocation refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('native/src/training/training_bridge_stub.cc')
          text = p.read_text()
          if '#include "core/allocation_guard.h"' not in text:
              anchor = '#include "backends/backend.h"\n'
              if text.count(anchor) != 1:
                  raise SystemExit('training include anchor mismatch')
              text = text.replace(anchor, anchor + '#include "core/allocation_guard.h"\n', 1)

          old = '''  try {\n    auto state = std::make_shared<OptimizerState>();\n    state->kind = kind;\n    state->module = module_state;\n    state->learning_rate = learning_rate;\n    state->momentum = momentum;\n    state->beta1 = beta1;\n    state->beta2 = beta2;\n    state->epsilon = epsilon;\n    state->weight_decay = weight_decay;\n\n    const auto parameters = Parameters(*module_state);\n    state->first_moment.reserve(parameters.size());\n    state->second_moment.reserve(parameters.size());\n    for (const auto& parameter : parameters) {\n      state->first_moment.emplace_back(static_cast<size_t>(parameter->numel()),\n                                       0.0f);\n      if (kind != OptimizerKind::kSgd) {\n        state->second_moment.emplace_back(\n            static_cast<size_t>(parameter->numel()), 0.0f);\n      }\n    }\n\n    return HandleRegistry::Instance().Insert(\n        HandleType::kOptimizer, std::move(state), out_optimizer);\n  } catch (const std::bad_alloc&) {\n    return OutOfMemory(std::string(operation) + ": allocation failed");\n  }'''
          new = '''  return AllocationGuard(operation, [&]() -> Status {\n    auto state = std::make_shared<OptimizerState>();\n    state->kind = kind;\n    state->module = module_state;\n    state->learning_rate = learning_rate;\n    state->momentum = momentum;\n    state->beta1 = beta1;\n    state->beta2 = beta2;\n    state->epsilon = epsilon;\n    state->weight_decay = weight_decay;\n\n    const auto parameters = Parameters(*module_state);\n    state->first_moment.reserve(parameters.size());\n    state->second_moment.reserve(parameters.size());\n    for (const auto& parameter : parameters) {\n      state->first_moment.emplace_back(static_cast<size_t>(parameter->numel()),\n                                       0.0f);\n      if (kind != OptimizerKind::kSgd) {\n        state->second_moment.emplace_back(\n            static_cast<size_t>(parameter->numel()), 0.0f);\n      }\n    }\n\n    return HandleRegistry::Instance().Insert(\n        HandleType::kOptimizer, std::move(state), out_optimizer);\n  });'''
          if text.count(old) != 1:
              raise SystemExit('optimizer allocation block mismatch')
          text = text.replace(old, new, 1)

          start_token = '  const float bound = 1.0f / std::sqrt(static_cast<float>(in_features));'
          end_token = '\n}\n\nStatus ModuleForward'
          start = text.index(start_token, text.index('Status LinearCreate'))
          end = text.index(end_token, start)
          replacement = '''  return AllocationGuard("linear_create", [&]() -> Status {\n    const float bound = 1.0f / std::sqrt(static_cast<float>(in_features));\n    std::vector<float> weight_values(static_cast<size_t>(weight_shape.numel));\n    std::vector<float> bias_values;\n    {\n      std::lock_guard<std::mutex> lock(RngMutex());\n      std::uniform_real_distribution<float> distribution(-bound, bound);\n      for (float& value : weight_values) value = distribution(Rng());\n      if (use_bias) {\n        bias_values.resize(static_cast<size_t>(out_features));\n        for (float& value : bias_values) value = distribution(Rng());\n      }\n    }\n\n    auto state = std::make_shared<LinearState>();\n    state->in_features = in_features;\n    state->out_features = out_features;\n    state->use_bias = use_bias;\n    status = MakeParameter(weight_shape, std::move(weight_values),\n                           &state->weight);\n    if (!status.ok()) return status;\n\n    if (use_bias) {\n      const int64_t bias_dims[1] = {out_features};\n      ShapeInfo bias_shape;\n      status = ValidateShape(bias_dims, 1, &bias_shape);\n      if (!status.ok()) return status;\n      status =\n          MakeParameter(bias_shape, std::move(bias_values), &state->bias);\n      if (!status.ok()) return status;\n    }\n\n    return HandleRegistry::Instance().Insert(\n        HandleType::kModule, std::move(state), out_module);\n  });'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text)
          PY
          git diff --check
      - name: Validate Release matrix
        run: |
          cmake -S native -B build/release -DCMAKE_BUILD_TYPE=Release -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure
      - name: Validate ASan and UBSan matrix
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S native -B build/asan -DCMAKE_BUILD_TYPE=Debug -DTENSORA_ENABLE_SANITIZERS=ON -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan --output-on-failure
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/training/training_bridge_stub.cc
          git diff --cached --check
          git commit -m 'refactor: guard core training allocations'
          git push origin HEAD:feature/training-engine-v1
