name: Core Storage Safety Repair

on:
  push:
    branches:
      - feature/training-engine-v1

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'ci: validate core storage safety repair' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/training-engine-v1
          fetch-depth: 0
      - name: Apply guarded core safety patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/core-safety.patch
          git apply --check /tmp/core-safety.patch
          git apply /tmp/core-safety.patch
          git diff --check
      - name: Validate Release matrix
        run: |
          cmake -S native -B build/release -DCMAKE_BUILD_TYPE=Release -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure
      - name: Validate ASan and UBSan matrix
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S native -B build/asan -DCMAKE_BUILD_TYPE=Debug -DTENSORA_ENABLE_SANITIZERS=ON -DTENSORA_BUILD_TESTS=ON -DTENSORA_BUILD_BENCHMARKS=OFF
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan --output-on-failure
      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/memory/cpu_storage.cc native/tests/training_core_internal_test.cc
          git diff --cached --check
          git commit -m 'fix: contain CPU storage allocation failures'
          git push origin HEAD:feature/training-engine-v1
