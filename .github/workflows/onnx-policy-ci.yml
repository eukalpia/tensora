name: ONNX Policy CI

on:
  push:
    branches:
      - 'work/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onnx-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Deterministic ONNX provider and error policies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ORT_VERSION: '1.26.0'
      ORT_SHA256: '1254da24fb389cf39dc0ff3451ab48301740ffbfcbaf646849df92f80ee92c57'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download and verify pinned ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          archive="build/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          curl --fail --location --retry 3 \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            --output "$archive"
          echo "${ORT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C build
          ort_root="${GITHUB_WORKSPACE}/build/onnxruntime-linux-x64-${ORT_VERSION}"
          echo "ORT_ROOT=${ort_root}" >> "$GITHUB_ENV"
          echo "ORT_LIBRARY_PATH=${ort_root}/lib" >> "$GITHUB_ENV"

      - name: Configure ONNX runtime
        shell: bash
        run: >-
          cmake -S native -B build/onnx-policy
          -DCMAKE_BUILD_TYPE=Debug
          -DTENSORA_WITH_TORCH=OFF
          -DTENSORA_WITH_ONNXRUNTIME=ON
          -DTENSORA_ONNXRUNTIME_ROOT="$ORT_ROOT"
          -DTENSORA_BUILD_TESTS=ON
          -DTENSORA_BUILD_BENCHMARKS=OFF

      - name: Build existing ONNX runtime and tests
        run: cmake --build build/onnx-policy --parallel 2

      - name: Compile deterministic ONNX policy contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -Inative/include -Inative/src -I"$ORT_ROOT/include" \
            native/tests/onnx_policy_test.cc \
            -Lbuild/onnx-policy -ltensora_native \
            -Wl,-rpath,"$GITHUB_WORKSPACE/build/onnx-policy" \
            -Wl,-rpath,"$ORT_LIBRARY_PATH" \
            -o build/onnx-policy/tensora_onnx_policy_tests

      - name: Run deterministic ONNX policy contract
        working-directory: build/onnx-policy
        env:
          LD_LIBRARY_PATH: ${{ env.ORT_LIBRARY_PATH }}
        run: ./tensora_onnx_policy_tests
