name: NN V2 CI

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'work/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nn-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-contracts:
    name: Core NN V2 native + declarative contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TENSORA_NATIVE_LIBRARY: ${{ github.workspace }}/build/nn-v2-core/libtensora_native.so
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Configure core-only Tensora
        run: >-
          cmake -S native -B build/nn-v2-core
          -DCMAKE_BUILD_TYPE=Release
          -DTENSORA_WITH_TORCH=OFF
          -DTENSORA_WITH_ONNXRUNTIME=OFF
          -DTENSORA_BUILD_TESTS=OFF
          -DTENSORA_BUILD_BENCHMARKS=OFF

      - name: Build core-only Tensora
        run: cmake --build build/nn-v2-core --parallel

      - name: Compile generalized optimizer proof
        run: >-
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror
          native/tests/nn_v2_optimizer_test.cc
          -Inative/include
          -Lbuild/nn-v2-core
          -Wl,-rpath,$PWD/build/nn-v2-core
          -ltensora_native
          -o build/nn_v2_optimizer_test

      - name: Run generalized optimizer proof
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/nn-v2-core
        run: ./build/nn_v2_optimizer_test

      - name: Compile state identity and transaction proof
        run: >-
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror
          native/tests/nn_v2_state_test.cc
          -Inative/include
          -Lbuild/nn-v2-core
          -Wl,-rpath,$PWD/build/nn-v2-core
          -ltensora_native
          -o build/nn_v2_state_test

      - name: Run state identity and transaction proof
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/nn-v2-core
        run: ./build/nn_v2_state_test

      - name: Compile activation and autograd proof
        run: >-
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror
          native/tests/nn_v2_activation_test.cc
          -Inative/include
          -Lbuild/nn-v2-core
          -Wl,-rpath,$PWD/build/nn-v2-core
          -ltensora_native
          -o build/nn_v2_activation_test

      - name: Run activation and autograd proof
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/nn-v2-core
        run: ./build/nn_v2_activation_test

      - name: Compile parameter freeze and unfreeze proof
        run: >-
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror
          native/tests/nn_v2_parameter_control_test.cc
          -Inative/include
          -Lbuild/nn-v2-core
          -Wl,-rpath,$PWD/build/nn-v2-core
          -ltensora_native
          -o build/nn_v2_parameter_control_test

      - name: Run parameter freeze and unfreeze proof
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/nn-v2-core
        run: ./build/nn_v2_parameter_control_test

      - name: Resolve Dart workspace
        run: dart pub get

      - name: Verify declarative integration formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format packages/tensora_train/integration_test
          git diff --exit-code -- packages/tensora_train/integration_test

      - name: Analyze declarative integration proof
        working-directory: packages/tensora_train
        run: dart analyze --fatal-infos --fatal-warnings integration_test

      - name: Run declarative MLP training and state proof
        working-directory: packages/tensora_train
        run: >-
          dart test integration_test/declarative_nn_v2_integration_test.dart
          --reporter expanded

      - name: Collect NN V2 Dart composition coverage
        shell: bash
        run: |
          set -euo pipefail
          coverage_dir="$GITHUB_WORKSPACE/build/nn-v2-dart-coverage"
          contract_fixture="$GITHUB_WORKSPACE/build/libtensora_nn_contract_fixture.so"
          mkdir -p "$coverage_dir"

          cc -std=c11 -fPIC -shared -Wall -Wextra -Werror \
            -DTENSORA_NATIVE_BUILD \
            -I "$GITHUB_WORKSPACE/native/include" \
            "$GITHUB_WORKSPACE/native/tests/dart_contract_fixture.c" \
            "$GITHUB_WORKSPACE/native/tests/dart_contract_nn_v2_fixture.c" \
            -o "$contract_fixture"

          (
            cd packages/tensora_nn
            dart test test \
              --coverage-path="$coverage_dir/nn.info" \
              --reporter expanded
          )
          (
            cd packages/tensora_nn
            TENSORA_NATIVE_LIBRARY="$contract_fixture" \
            TENSORA_NN_CONTRACT_FIXTURE="$contract_fixture" \
              dart test integration_test/native_contract_edge_test.dart \
                --coverage-path="$coverage_dir/nn-contract.info" \
                --reporter expanded
          )
          (
            cd packages/tensora_optim
            dart test test \
              --coverage-path="$coverage_dir/optim.info" \
              --reporter expanded
          )
          (
            cd packages/tensora_train
            dart test integration_test/declarative_nn_v2_integration_test.dart \
              --coverage-path="$coverage_dir/train.info" \
              --reporter expanded
          )

          nn_status=0
          optim_status=0
          python tools/merge_dart_coverage.py "$coverage_dir" \
            --source-fragment '/packages/tensora_nn/lib/' \
            --output "$coverage_dir/tensora-nn-merged.info" \
            --summary "$coverage_dir/tensora-nn-summary.md" || nn_status=$?
          python tools/merge_dart_coverage.py "$coverage_dir" \
            --source-fragment '/packages/tensora_optim/lib/' \
            --output "$coverage_dir/tensora-optim-merged.info" \
            --summary "$coverage_dir/tensora-optim-summary.md" || optim_status=$?
          if [ "$nn_status" -ne 0 ] || [ "$optim_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload NN V2 Dart coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tensora-nn-v2-dart-coverage
          path: build/nn-v2-dart-coverage/
          if-no-files-found: warn
          retention-days: 7
